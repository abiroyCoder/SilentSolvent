name: SilentSolvent CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: silentsolvent-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPACTC_VERSION: 0.31.1
  NODE_VERSION: 22.19.0

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned Compact compiler
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          compact update "$COMPACTC_VERSION"
          test "$(compact compile --version)" = "$COMPACTC_VERSION"
      - name: Install locked dependencies
        run: npm ci
      - name: Compile Compact contract
        run: npm run compile
      - name: Synchronize generated artifacts
        run: npm run copy:managed
      - name: Check compiler metadata and artifact drift
        run: node scripts/check-artifact-drift.mjs
      - name: Type-check Node packages
        run: npx tsc --noEmit
      - name: Run contract tests
        run: npm test
      - name: Build frontend
        run: npm run build
        env:
          VITE_ATTESTATION_API_URL: https://attestation.invalid.example
