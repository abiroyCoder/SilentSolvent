name: SilentSolvent CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Compile Compact Contract
        run: npm run compile

      - name: Start Midnight Devnet
        run: npm run env:up

      - name: Wait for DUST
        run: npx ts-node --esm scripts/wait-for-dust.ts

      - name: Run Contract Tests
        run: npm run test:local

      - name: Copy Assets for Frontend
        run: npm run copy:managed

      - name: Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build
