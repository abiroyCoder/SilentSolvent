name: SilentSolvent Preprod Deployment

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY_PREPROD to authorize a real deployment'
        required: true
        type: string

permissions:
  contents: read

env:
  COMPACTC_VERSION: 0.31.1
  NODE_VERSION: 22.19.0

jobs:
  deploy-preprod:
    if: github.event.inputs.confirmation == 'DEPLOY_PREPROD'
    environment: preprod
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install pinned Compact compiler
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          compact update "$COMPACTC_VERSION"
          test "$(compact compile --version)" = "$COMPACTC_VERSION"
      - name: Install locked dependencies
        run: npm ci
      - name: Compile and validate generated artifacts
        run: |
          npm run compile
          npm run copy:managed
          node scripts/check-artifact-drift.mjs
          npx tsc --noEmit
      - name: Run contract tests
        run: npm test
      - name: Deploy through the real Preprod wallet
        env:
          MIDNIGHT_PREPROD_MNEMONIC: ${{ secrets.MIDNIGHT_PREPROD_MNEMONIC }}
          MIDNIGHT_PROOF_SERVER: ${{ secrets.MIDNIGHT_PROOF_SERVER }}
          ATTESTATION_API_URL: ${{ secrets.ATTESTATION_API_URL }}
          SILENTSOLVENT_ADMIN_SECRET_HEX: ${{ secrets.SILENTSOLVENT_ADMIN_SECRET_HEX }}
          SILENTSOLVENT_THRESHOLD: ${{ vars.SILENTSOLVENT_THRESHOLD }}
          SILENTSOLVENT_ATTESTATION_CAP: ${{ vars.SILENTSOLVENT_ATTESTATION_CAP }}
        run: node --experimental-strip-types scripts/deploy-preprod.ts > deployment-record.json
      - name: Verify deployment through the Preprod indexer
        run: node scripts/verify-deployment.mjs deployment-record.json
      - name: Upload redacted deployment record
        uses: actions/upload-artifact@v4
        with:
          name: silentsolvent-preprod-deployment
          path: deployment-record.json
          if-no-files-found: error
