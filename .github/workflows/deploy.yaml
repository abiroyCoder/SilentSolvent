name: SilentSolvent Deployment & Verification

on:
  workflow_dispatch:
    inputs:
      target_network:
        description: 'Target Network for Contract Deployment'
        required: true
        default: 'preprod'
        type: choice
        options:
          - preprod
          - preview
          - local

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          $HOME/.local/bin/compact update

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Verify Contract Compilation
        run: |
          cp contracts/managed/silentsolvent/contract/index.js /tmp/index.js.bak
          compact compile contracts/silentsolvent.compact contracts/managed/silentsolvent
          cp /tmp/index.js.bak contracts/managed/silentsolvent/contract/index.js
          node scripts/patch-runtime.cjs

      - name: Run Full Test Suite (Circuits + E2E)
        run: npm test

      - name: Prepare Deployment Artifacts
        run: npx ts-node --esm scripts/deploy-preprod.ts

      - name: Build Production Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build
